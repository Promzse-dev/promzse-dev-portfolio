<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - PROMZSE STORE</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>PROMZSE STORE</h1>
        <p>Quality Products, Great Prices</p>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="cart.html">🛒 Cart: <span id="cart-count">0</span></a>
    </nav>

    <section class="contact">
        <h2>Contact Us</h2>

        <p>Have a question? Send us a message and we'll be happy to hear from you.</p>

        <form onsubmit="showMessage(event)">
            <label for="name">Your Name</label>
            <input type="text" id="name" placeholder="Enter your name" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="Enter your email" required>

            <label for="message">Your Message</label>
            <textarea id="message" rows="5" placeholder="Write your message..." required></textarea>

            <button type="submit">Send Message</button>
        </form>
    </section>

    <footer>
        <p>&copy; 2026 PROMZSE STORE. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
